name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    if: ${{ !github.event.deleted }}
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.package.outputs.commit }}
    steps:
      - name: Check out source and pinned native component
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Build and run light theme regressions
        shell: pwsh
        env:
          LUMABAR_UI_THEME: light
        run: ./build.ps1

      - name: Run dark theme regressions
        shell: pwsh
        env:
          LUMABAR_UI_THEME: dark
        run: ./tests/bin/LumaBar.Tests.exe

      - name: Verify the release version and package both archives
        id: package
        shell: pwsh
        run: |
          $fileVersion = [version](Get-Item -LiteralPath './LumaBar.exe').VersionInfo.FileVersion
          $components = if ($fileVersion.Revision -gt 0) { 4 } else { 3 }
          $version = $fileVersion.ToString($components)
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match executable version $fileVersion. Expected v$version."
          }

          ./package.ps1 -OutputDirectory 'dist/release'
          foreach ($name in "LumaBar-$version-preview-x64.zip", "LumaBar-$version-source.zip") {
            if (!(Test-Path -LiteralPath "dist/release/$name" -PathType Leaf)) {
              throw "Missing release archive: $name"
            }
          }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload verified packages for publishing
        uses: actions/upload-artifact@v7
        with:
          name: lumabar-release
          path: |
            dist/release/LumaBar-${{ steps.package.outputs.version }}-preview-x64.zip
            dist/release/LumaBar-${{ steps.package.outputs.version }}-source.zip
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish GitHub prerelease
    needs: build
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v8
        with:
          name: lumabar-release
          path: release-assets

      - name: Create GitHub Release with both archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          tagged_commit="$(gh api "repos/$GH_REPO/commits/refs%2Ftags%2F$tag" --jq .sha)"
          if [[ "$tagged_commit" != "$BUILT_COMMIT" ]]; then
            echo 'The remote tag no longer points to the tested commit.' >&2
            exit 1
          fi

          gh release create "$tag" --verify-tag --prerelease --generate-notes \
            --title "LumaBar $version 预览版" \
            "release-assets/LumaBar-$version-preview-x64.zip" \
            "release-assets/LumaBar-$version-source.zip"
